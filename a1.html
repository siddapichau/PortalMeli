<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise Completa - BPP 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* Barra de Progresso Topo */
    #top-progress-bar { position: fixed; top: 0; left: 0; height: 4px; background: #FFD700; width: 0%; z-index: 9999; transition: width 0.2s ease; box-shadow: 0 0 10px #FFD700; }

    /* Tabela Layout */
    .table-container { flex: 1; overflow: auto; border: 1px solid #d1d5db; border-radius: 8px; background: white; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 8px; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
    
    /* Cabeçalho Fixo no Topo da Tabela */
    thead { position: sticky; top: 0; z-index: 50; }
    thead th { 
      background-color: #FFD700 !important; color: #000 !important; 
      font-size: 11px; padding: 8px 6px; 
      border: 1px solid #cbd5e1; text-align: left; font-weight: 800;
      white-space: normal; word-break: break-word; line-height: 1.2;
      user-select: none; vertical-align: bottom; min-height: 50px;
    }
    
    /* Hover Suave */
    tbody tr { transition: filter 0.15s ease-in-out; }
    tbody tr:hover { filter: brightness(0.92); cursor: pointer; }
    
    tbody td { 
      background-color: #ffffff; font-size: 11px; padding: 6px 8px; 
      border: 1px solid #e5e7eb; color: #374151;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Resizer Arrastável */
    .resizer { position: absolute; right: -3px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 60; background: transparent; }
    .resizer:hover, .resizer.resizing { background: rgba(45, 50, 119, 0.5); }

    /* Fundo Cores de Área */
    .bg-op-sc { background-color: #990000 !important; color: white !important; font-weight: bold; }
    .bg-op-lm { background-color: #0b5394 !important; color: white !important; font-weight: bold; }
    .bg-op-inv { background-color: #674ea7 !important; color: white !important; font-weight: bold; }
    .bg-op-sist { background-color: #434343 !important; color: white !important; font-weight: bold; }

    /* Fonte Verde para Movimentação */
    .text-mov-green {
      color: #00FF00 !important;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      font-weight: 900;
    }

    /* Cores de Inventário */
    .cell-inv-amarelo { background-color: #fef08a !important; }
    .cell-inv-verde { background-color: #bbf7d0 !important; }
    
    /* Filtros (Dropdown Flutuante) */
    .dropdown-menu { display: none; position: fixed; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; min-width: 220px; max-height: 300px; overflow-y: auto; padding: 8px; color: #333;}
    .dropdown-menu.show { display: block; }
    .dropdown-menu label { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px; cursor: pointer; border-radius: 4px;}
    .dropdown-menu label:hover { background-color: #f3f4f6; }
    .sort-btn { display: block; width: 100%; text-align: left; padding: 6px 8px; font-size: 11px; font-weight: bold; color: #2D3277; border-bottom: 1px solid #eee; margin-bottom: 4px;}
    .sort-btn:hover { background-color: #f3f4f6; }
    
    /* Menu de Configuração de Colunas */
    .col-menu { display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; min-width: 250px; max-height: 400px; overflow-y: auto; padding: 8px; margin-top: 5px;}
    .col-menu.show { display: block; }
    .col-menu label { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px; cursor: pointer; border-radius: 4px;}
    .col-menu label:hover { background-color: #f3f4f6; }
    
    /* Visual do Operador na Célula (Conforme mockup) */
    .op-cell-content { display: flex; flex-direction: column; gap: 2px; line-height: 1.1; }
    .op-top-row { display: flex; align-items: center; gap: 4px; }
    .turno-badge { font-size: 9px; font-weight: 900; background: #e5e7eb; color: #000; padding: 1px 4px; border-radius: 2px; }
    .op-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .id-badge { font-size: 9px; font-family: monospace; color: rgba(255,255,255,0.8); margin-left: 2px; }

    /* Classe para Ocultar Coluna */
    .col-hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="top-progress-bar"></div>

  <!-- Header Principal -->
  <div class="p-3 bg-white shadow-sm flex items-center justify-between border-b z-30 relative shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-2xl text-teal-600"><i class="fas fa-table"></i></span>
      <div>
        <h1 class="text-lg font-black text-[#2D3277]">Análise Completa</h1>
        <p class="text-xs text-gray-500 font-bold" id="subtitle">Carregando...</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <div style="position: relative;">
        <button onclick="toggleMenuColunas(event)" class="bg-gray-100 text-gray-700 px-3 py-2 rounded text-sm font-bold border border-gray-300 hover:bg-gray-200 transition">
          <i class="fas fa-columns mr-1"></i> Colunas
        </button>
        <div class="col-menu" id="menu-colunas"></div>
      </div>
      <button onclick="limparFiltros()" class="bg-red-50 text-red-600 px-3 py-2 rounded text-sm font-bold border border-red-200 hover:bg-red-100 transition"><i class="fas fa-eraser mr-1"></i> Limpar</button>
    </div>
  </div>

  <!-- Resumo no Topo -->
  <div id="resumo-topo" class="px-4 py-2 bg-gray-50 border-b flex gap-4 overflow-x-auto z-20 shadow-inner shrink-0">
    <div class="text-xs font-bold text-gray-500 self-center">Total: <span id="total-pacotes" class="text-[#2D3277] text-sm">0</span></div>
    <div id="resumo-resp-container" class="flex gap-2"></div>
  </div>

  <!-- Barra de Pesquisa -->
  <div class="px-4 py-2 bg-white flex justify-between items-center border-b z-20 shrink-0">
    <input type="text" id="search-global" placeholder="🔍 Pesquisar..." class="border p-1.5 rounded w-full max-w-sm text-sm focus:outline-none focus:border-teal-500" oninput="aplicarFiltros()">
    <span id="contador-linhas" class="text-xs text-gray-500 font-bold bg-gray-100 px-3 py-1 rounded-full">0 linhas exibidas</span>
  </div>

  <div id="floating-dropdown" class="dropdown-menu"></div>

  <!-- Tabela -->
  <div class="table-container">
    <table id="tabela">
      <thead id="tabela-cabecalho"></thead>
      <tbody id="tabela-corpo"></tbody>
    </table>
  </div>

  <script src="assets/js/n8n-api.js?v=1"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby4WP4m6JFNNNmToO6zkC_aYmWH3kEJWH2fbqHFhyOm0eoYXlIcmnr861dbjYlY3e4thA/exec';
    let dadosOriginais = [];
    let dadosFiltrados = [];
    let colunas = [];
    let filtrosAtivos = {}; 
    let ordenacao = { coluna: null, direcao: 'asc' };
    let colunasOcultas = new Set();
    let activeDropdownCol = null;

    async function callAPI(action, payload = {}) {
      return PortalN8N.callAPI(action, payload, async () => {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
        return await res.json();
      });
    }

    // Inicia o carregamento
    async function iniciar() {
      document.getElementById('top-progress-bar').style.width = '20%';
      try {
        const r = await callAPI('getDashboardInit');
        if (r.erro) throw new Error(r.erro);
        
        document.getElementById('top-progress-bar').style.width = '50%';
        dadosOriginais = r.dadosCompletos || [];
        
        if(dadosOriginais.length > 0) {
          colunas = Object.keys(dadosOriginais[0]).filter(c => !c.startsWith('_'));
        }
        
        document.getElementById('subtitle').innerText = `Aba ${r.abaAtiva} • ${dadosOriginais.length} pacotes`;
        
        construirCabecalho();
        gerarMenuColunas();
        gerarResumoTopo();
        
        dadosFiltrados = [...dadosOriginais];
        
        // Renderização em Blocos Assíncrona (Não trava a tela)
        await renderizarEmBlocos(dadosFiltrados);
        
        atualizarContador();
        document.getElementById('top-progress-bar').style.width = '100%';
        setTimeout(() => document.getElementById('top-progress-bar').style.opacity = '0', 500);
        
      } catch(e) { 
        document.getElementById('top-progress-bar').style.width = '100%';
        document.getElementById('top-progress-bar').style.backgroundColor = 'red';
        Swal.fire('Erro', e.message, 'error'); 
      }
    }

    // --- RESUMO NO TOPO ---
    function gerarResumoTopo() {
      document.getElementById('total-pacotes').innerText = dadosOriginais.length;
      const respCounts = {};
      dadosOriginais.forEach(r => {
         let colResp = colunas.find(c=>c.toLowerCase().includes('responsabilidade'));
         let resp = r[colResp] || 'N/A';
         respCounts[resp] = (respCounts[resp] || 0) + 1;
      });
      
      const container = document.getElementById('resumo-resp-container');
      container.innerHTML = Object.entries(respCounts).map(([resp, count]) => {
         let colorClass = 'bg-gray-200 text-gray-700';
         if(resp.includes('SERVICE')) colorClass = 'bg-[#990000] text-white';
         else if(resp.includes('LAST')) colorClass = 'bg-[#0b5394] text-white';
         else if(resp.includes('INVENT')) colorClass = 'bg-[#674ea7] text-white';
         
         return `<div class="${colorClass} px-2 py-1 rounded text-[10px] font-bold shadow-sm">${resp}: ${count}</div>`;
      }).join('');
    }

    // --- CONSTRUÇÃO DA TABELA ---
    function construirCabecalho() {
      const thead = document.getElementById('tabela-cabecalho');
      thead.innerHTML = '';
      
      const tr = document.createElement('tr');
      colunas.forEach(col => {
        const th = document.createElement('th');
        th.style.position = 'relative';
        
        if (col.toLowerCase().includes('descri')) th.style.minWidth = '250px';
        else if (col.toLowerCase().includes('observ')) th.style.minWidth = '150px';
        else if (col.toLowerCase().includes('operador') || col.toLowerCase().includes('movimenta')) th.style.minWidth = '170px';
        else th.style.minWidth = '100px';

        th.innerHTML = `
          <div class="flex justify-between items-start w-full gap-1">
            <span>${col.replace(/_/g, ' ')}</span>
            <button onclick="event.stopPropagation(); abrirFiltroFlutuante('${col}', this)" class="px-1 text-gray-600 hover:text-black hover:bg-yellow-500 rounded flex-shrink-0 mt-0.5"><i class="fas fa-filter"></i></button>
          </div>
        `;

        const resizer = document.createElement('div');
        resizer.className = 'resizer';
        resizer.onmousedown = (e) => iniciarResize(e, th);
        th.appendChild(resizer);

        tr.appendChild(th);
      });
      thead.appendChild(tr);
    }

    // --- REDIMENSIONAMENTO ---
    function iniciarResize(e, th) {
      e.preventDefault(); e.stopPropagation();
      const startX = e.pageX; const startWidth = th.offsetWidth;
      const resizer = th.querySelector('.resizer');
      resizer.classList.add('resizing');

      function onMouseMove(ev) {
        const newWidth = startWidth + (ev.pageX - startX);
        if (newWidth > 60) { th.style.width = newWidth + 'px'; th.style.minWidth = newWidth + 'px'; }
      }
      function onMouseUp() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    // --- OCULTAR COLUNAS ---
    function toggleMenuColunas(e) {
      e.stopPropagation();
      document.getElementById('menu-colunas').classList.toggle('show');
      document.getElementById('floating-dropdown').classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.col-menu') && !e.target.closest('button')) document.getElementById('menu-colunas').classList.remove('show');
      if (!e.target.closest('#floating-dropdown') && !e.target.closest('button')) { document.getElementById('floating-dropdown').classList.remove('show'); activeDropdownCol = null; }
    });

    function gerarMenuColunas() {
      const menu = document.getElementById('menu-colunas');
      menu.innerHTML = colunas.map(col => `
        <label onclick="event.stopPropagation()">
          <input type="checkbox" ${!colunasOcultas.has(col) ? 'checked' : ''} onchange="toggleColunaVisivel('${col}', this.checked)" class="accent-teal-600">
          <span class="truncate">${col.replace(/_/g, ' ')}</span>
        </label>
      `).join('');
    }

    function toggleColunaVisivel(col, visivel) {
      if (visivel) colunasOcultas.delete(col);
      else colunasOcultas.add(col);
      const index = colunas.indexOf(col) + 1;
      document.querySelectorAll(`#tabela th:nth-child(${index}), #tabela td:nth-child(${index})`).forEach(el => {
        el.classList.toggle('col-hidden', !visivel);
      });
    }

    // --- FILTRO FLUTUANTE ---
    const floatingMenu = document.getElementById('floating-dropdown');
    
    function abrirFiltroFlutuante(col, btnElement) {
      if (activeDropdownCol === col) { floatingMenu.classList.remove('show'); activeDropdownCol = null; return; }
      
      activeDropdownCol = col;
      const rect = btnElement.getBoundingClientRect();
      floatingMenu.style.top = (rect.bottom + 5) + 'px';
      floatingMenu.style.left = Math.max(10, rect.left - 150) + 'px';
      
      const valoresUnicos = [...new Set(dadosOriginais.map(row => row[col]))].sort();
      
      let menuHtml = `
        <div class="sort-btn" onclick="event.stopPropagation(); ordenarPor('${col}', 'asc'); fecharFiltro();">⬆️ Ordenar A-Z</div>
        <div class="sort-btn" onclick="event.stopPropagation(); ordenarPor('${col}', 'desc'); fecharFiltro();">⬇️ Ordenar Z-A</div>
        <hr class="my-1">
        <div class="flex justify-between px-2 mb-2">
           <button class="text-[10px] text-blue-600 font-bold hover:underline" onclick="event.stopPropagation(); selecionarTodos('${col}')">Todos</button>
           <button class="text-[10px] text-red-600 font-bold hover:underline" onclick="event.stopPropagation(); limparFiltroColuna('${col}')">Limpar</button>
        </div>
      `;
      
      menuHtml += valoresUnicos.map(val => {
        const checked = filtrosAtivos[col] && filtrosAtivos[col].has(val) ? 'checked' : '';
        return `<label onclick="event.stopPropagation()"><input type="checkbox" value="${val}" ${checked} onchange="atualizarFiltro('${col}', this.value, this.checked)" class="accent-teal-600"><span class="truncate" title="${val}">${val || '(Vazio)'}</span></label>`;
      }).join('');
      
      floatingMenu.innerHTML = menuHtml;
      floatingMenu.classList.add('show');
    }
    
    function fecharFiltro() { floatingMenu.classList.remove('show'); activeDropdownCol = null; }

    function atualizarFiltro(col, val, checked) {
      if (!filtrosAtivos[col]) filtrosAtivos[col] = new Set();
      if (checked) filtrosAtivos[col].add(val);
      else { filtrosAtivos[col].delete(val); if (filtrosAtivos[col].size === 0) delete filtrosAtivos[col]; }
      aplicarFiltros();
    }
    function selecionarTodos(col) {
      const vals = [...new Set(dadosOriginais.map(row => row[col]))];
      filtrosAtivos[col] = new Set(vals);
      document.querySelectorAll('#floating-dropdown input[type="checkbox"]').forEach(cb => cb.checked = true);
      aplicarFiltros();
    }
    function limparFiltroColuna(col) {
      delete filtrosAtivos[col];
      document.querySelectorAll('#floating-dropdown input[type="checkbox"]').forEach(cb => cb.checked = false);
      aplicarFiltros();
    }
    function limparFiltros() {
      filtrosAtivos = {}; ordenacao = { coluna: null, direcao: 'asc' };
      document.getElementById('search-global').value = '';
      aplicarFiltros(); fecharFiltro();
    }

    async function aplicarFiltros() {
      const search = document.getElementById('search-global').value.toLowerCase().trim();
      dadosFiltrados = dadosOriginais.filter(row => {
        if (search) {
          const match = Object.keys(row).some(k => !k.startsWith('_') && String(row[k]).toLowerCase().includes(search));
          if (!match) return false;
        }
        for (const [col, vals] of Object.entries(filtrosAtivos)) {
          if (!vals.has(row[col])) return false;
        }
        return true;
      });

      if (ordenacao.coluna) {
        dadosFiltrados.sort((a, b) => {
          const valA = a[ordenacao.coluna]; const valB = b[ordenacao.coluna];
          const numA = parseFloat(String(valA).replace('R$', '').replace(/\./g, '').replace(',', '.'));
          const numB = parseFloat(String(valB).replace('R$', '').replace(/\./g, '').replace(',', '.'));
          if (!isNaN(numA) && !isNaN(numB) && String(valA).trim() !== '' && String(valB).trim() !== '') return ordenacao.direcao === 'asc' ? numA - numB : numB - numA;
          return ordenacao.direcao === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
        });
      }

      document.getElementById('tabela-corpo').innerHTML = ''; 
      await renderizarEmBlocos(dadosFiltrados);
      atualizarContador();
    }

    function ordenarPor(col, dir) { ordenacao.coluna = col; ordenacao.direcao = dir; aplicarFiltros(); }
    function atualizarContador() { document.getElementById('contador-linhas').innerText = `${dadosFiltrados.length} de ${dadosOriginais.length} linhas`; }

    // --- RENDERIZAÇÃO ASSÍNCRONA EM BLOCOS ---
    async function renderizarEmBlocos(dadosArray) {
      const tbody = document.getElementById('tabela-corpo');
      const total = dadosArray.length;
      const chunkSize = 100;
      let index = 0;

      if (tbody.innerHTML === '') tbody.innerHTML = '';

      return new Promise(resolve => {
        function processChunk() {
          if (index >= total) { resolve(); return; }

          const limit = Math.min(index + chunkSize, total);
          let html = '';
          
          for (let i = index; i < limit; i++) {
            const row = dadosArray[i];
            html += `<tr data-id="${row['_idNum']}" ondblclick="abrirEdicao('${row['_idNum']}')">`;
            
            colunas.forEach(col => {
              const isOculta = colunasOcultas.has(col) ? 'col-hidden' : '';
              let val = row[col] !== undefined ? row[col] : '-';
              let innerHtml = `<span class="truncate block" title="${val}">${val}</span>`;
              let extraClasses = '';
              
              // Formatar Valores R$
              if (col.toLowerCase().includes('valores') || col.toLowerCase().includes('valor')) {
                let num = parseFloat(String(val).replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                if(!isNaN(num)) innerHtml = `<span class="truncate block" title="${val}">R$ ${num.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
              }
              
              // Colunas de Operadores (Nomes AC, AD, AE)
              if (col.toLowerCase().includes('ultimo_operador') || col.toLowerCase().includes('penultimo_operador') || col.toLowerCase().includes('antepenultimo_operador')) {
                 let isUlt = col.toLowerCase().includes('ultimo');
                 let isPen = col.toLowerCase().includes('penultimo');
                 let isAnt = col.toLowerCase().includes('antepenultimo');

                 let turno = isUlt ? row['_turnoUlt'] : isPen ? row['_turnoPen'] : row['_turnoAnt'];
                 let opId = isUlt ? row['_idUlt'] : isPen ? row['_idPen'] : row['_idAnt'];
                 let isMov = isUlt ? row['_movUlt'] : isPen ? row['_movPen'] : row['_movAnt'];
                 
                 // Responsabilidade (para colorir o fundo)
                 let colResp = colunas.find(c=>c.toLowerCase().includes('responsabilidade'));
                 let respPacote = row[colResp] || '';

                 // Layout do Mockup: [Turno] [Nome] em cima, [ID] embaixo
                 innerHtml = `
                   <div class="op-cell-content">
                     <div class="op-top-row">
                       <span class="turno-badge">${turno || '--'}</span>
                       <span class="op-name" title="${val}">${val}</span>
                     </div>
                     <span class="id-badge">${opId || '--'}</span>
                   </div>
                 `;

                 // Cores de Fundo por Área
                 if(respPacote.includes('SERVICE') || respPacote.includes('TRATATIVA')) extraClasses += ' bg-op-sc';
                 else if(respPacote.includes('LAST')) extraClasses += ' bg-op-lm';
                 else if(respPacote.includes('INVENTARIO') || respPacote.includes('INVENTÁRIO')) extraClasses += ' bg-op-inv';
                 
                 // Fonte Verde se houve movimentação
                 if(isMov) extraClasses += ' text-mov-green';
              }

              if (col.toLowerCase().includes('inventariado')) {
                 if(String(val).toLowerCase().includes('ñ entrou') || String(val).toLowerCase().includes('n entrou')) extraClasses += ' cell-inv-amarelo';
                 else if(String(val).toLowerCase().includes('pendente') || String(val).toLowerCase().includes('verificados')) extraClasses += ' cell-inv-verde';
              }
              
              if (col.toLowerCase().includes('responsabilidade')) {
                 if(String(val).includes('SERVICE')) extraClasses += ' bg-op-sc';
                 else if(String(val).includes('LAST')) extraClasses += ' bg-op-lm';
                 else if(String(val).includes('INVENTARIO') || String(val).includes('INVENTÁRIO')) extraClasses += ' bg-op-inv';
              }

              html += `<td class="${isOculta} ${extraClasses}">${innerHtml}</td>`;
            });
            html += `</tr>`;
          }
          
          tbody.insertAdjacentHTML('beforeend', html);
          index = limit;
          
          const pct = Math.min(100, Math.round((index / total) * 100));
          document.getElementById('top-progress-bar').style.width = pct + '%';

          requestAnimationFrame(processChunk);
        }
        
        if (total === 0) {
          tbody.innerHTML = '<tr><td colspan="100" class="text-center p-4 text-gray-500 font-bold">Nenhum resultado encontrado.</td></tr>';
          resolve();
        } else {
          processChunk();
        }
      });
    }

    // --- EDIÇÃO COMPLETA ---
    function abrirEdicao(id) {
      const row = dadosOriginais.find(r => r['_idNum'] === id);
      if(!row) return;
      
      const currentAba = document.getElementById('subtitle').innerText.split('•')[0].replace('Aba', '').trim();
      
      const colTurno = colunas.find(c=>c.toLowerCase().includes('turno') && !c.toLowerCase().includes('ult'));
      const colResp = colunas.find(c=>c.toLowerCase().includes('responsabilidade'));
      const colObs = colunas.find(c=>c.toLowerCase().includes('observ'));
      const colDesc = colunas.find(c=>c.toLowerCase().includes('descri'));
      const colValReal = colunas.find(c=>c.toLowerCase().includes('valores real') || c.toLowerCase().includes('valor real'));

      const opcoesTurno = [...new Set(dadosOriginais.map(r => r[colTurno]))].filter(Boolean).sort();
      const opcoesResp = [...new Set(dadosOriginais.map(r => r[colResp]))].filter(Boolean).sort();

      let infoHtml = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4 bg-gray-50 p-4 rounded-lg border border-gray-200 text-left text-xs">`;
      colunas.forEach(col => {
         if (col !== colTurno && col !== colResp && col !== colObs && col !== colDesc && col !== colValReal) {
            let label = col.replace(/_/g, ' ').toUpperCase();
            let val = row[col] || '-';
            infoHtml += `<div><strong class="text-gray-500">${label}:</strong><br><span class="font-bold text-gray-800">${val}</span></div>`;
         }
      });
      infoHtml += `</div>`;

      Swal.fire({
        title: `<div class="text-lg font-black text-[#2D3277]"><i class="fas fa-edit mr-2"></i>Editar Pacote: ${id}</div>`,
        html: `
          <div class="text-left text-sm space-y-3 p-1 max-h-[70vh] overflow-y-auto custom-scrollbar">
            ${infoHtml}
            <div class="border-t pt-4">
              <h4 class="font-bold text-xs text-gray-600 mb-2 uppercase">Campos Editáveis</h4>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${colTurno ? `<div><label class="font-bold text-gray-600 text-xs uppercase">Turno</label>
                  <select id="edit-turno" class="w-full border p-2 rounded focus:border-teal-500 outline-none text-sm">
                    ${opcoesTurno.map(o => `<option value="${o}" ${row[colTurno] === o ? 'selected' : ''}>${o}</option>`).join('')}
                  </select></div>` : ''}
                  
                ${colResp ? `<div><label class="font-bold text-gray-600 text-xs uppercase">Responsabilidade</label>
                  <select id="edit-resp" class="w-full border p-2 rounded focus:border-teal-500 outline-none text-sm">
                    ${opcoesResp.map(o => `<option value="${o}" ${row[colResp] === o ? 'selected' : ''}>${o}</option>`).join('')}
                  </select></div>` : ''}
              </div>
              
              ${colDesc ? `<div class="mt-3"><label class="font-bold text-gray-600 text-xs uppercase">Descrição</label>
                <input type="text" id="edit-desc" class="w-full border p-2 rounded focus:border-teal-500 outline-none text-sm" value="${row[colDesc] || ''}"></div>` : ''}
                
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                ${colValReal ? `<div><label class="font-bold text-gray-600 text-xs uppercase">Valor Real (R$)</label>
                  <input type="text" id="edit-val-real" class="w-full border p-2 rounded focus:border-teal-500 outline-none text-sm" value="${row[colValReal] || ''}" placeholder="Ex: 84,90 ou R$ 84.90"></div>` : ''}
                  
                ${colObs ? `<div><label class="font-bold text-gray-600 text-xs uppercase">Observações</label>
                  <input type="text" id="edit-obs" class="w-full border p-2 rounded focus:border-teal-500 outline-none text-sm" value="${row[colObs] || ''}"></div>` : ''}
              </div>
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '<i class="fas fa-save"></i> Salvar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#2D3277',
        customClass: { popup: 'rounded-xl shadow-2xl border-t-4 border-[#FFD700]' },
        preConfirm: async () => {
          Swal.showLoading();
          const checkAndSave = async (colName, elId) => {
            if(!colName) return;
            const el = document.getElementById(elId);
            if(!el) return;
            const newVal = el.value;
            if (newVal !== String(row[colName] || '')) {
               const res = await callAPI('salvarEdicaoAnalise', { id: id, coluna: colName, valor: newVal, nomeAba: currentAba });
               if(res.erro) throw new Error(res.erro);
               row[colName] = newVal; 
            }
          };
          try {
            await checkAndSave(colTurno, 'edit-turno');
            await checkAndSave(colResp, 'edit-resp');
            await checkAndSave(colDesc, 'edit-desc');
            await checkAndSave(colValReal, 'edit-val-real');
            await checkAndSave(colObs, 'edit-obs');
            return true;
          } catch (e) {
            return Swal.showValidationMessage(`Erro: ${e.message}`);
          }
        }
      }).then((result) => {
        if(result.isConfirmed) {
          Swal.fire({ title: 'Salvo!', text: 'Alterações aplicadas.', icon: 'success', timer: 1500, showConfirmButton: false });
          aplicarFiltros(); 
        }
      });
    }

    window.onload = iniciar;
  </script>
</body>
</html>
